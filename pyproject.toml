[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipulse-scraper"
version = "1.0.0"
description = "Collects AI news from Hacker News, arXiv, company blogs and tech press into one JSON feed."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shako", email = "mandarincat07@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.5"]

[project.scripts]
aipulse-scraper = "aipulse_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["aipulse_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
