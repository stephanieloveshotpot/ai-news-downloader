name: Release scraper executable

# Every push to main (or a tag like v1.0.0) builds aipulse-scraper.exe on
# Windows and attaches it to a GitHub Release named after the version in
# pyproject.toml. Bump that version to publish a new release. The
# ai-news-desk app's release workflow downloads the .exe and bundles it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pyinstaller aipulse-scraper.spec
      - name: Smoke test the executable
        run: dist\aipulse-scraper.exe --list-sources
      - uses: actions/upload-artifact@v4
        with:
          name: aipulse-scraper-windows
          path: dist/aipulse-scraper.exe
      - name: Read version from pyproject.toml
        id: ver
        shell: bash
        run: echo "tag=v$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Publish release (creates the tag if it doesn't exist yet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Scraper ${{ steps.ver.outputs.tag }}
          files: dist/aipulse-scraper.exe
          generate_release_notes: true
