name: Build and publish the installer

# Every push to main (or a manual run) does this on Windows:
#   1. downloads the newest app bundle from the ai-news-desk repo's Releases
#      (needs the APP_TOKEN secret because that repo is private),
#   2. builds the custom installer in setup/ (WPF, .NET Framework 4.8),
#   3. publishes AI-Pulse-Setup-<version>.exe to this repo's Releases,
#      where <version> is the app bundle's version.
#
# The app repo's release workflow starts this one as soon as a new app bundle
# is out. As a safety net, a check every 6 hours builds any app version that
# has no installer yet, so this repo never has to be touched when only the
# app changed.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      app_tag:
        description: "App release tag to wrap (blank = latest)"
        required: false

permissions:
  contents: write

jobs:
  # Scheduled runs only build when the newest app version has no installer yet.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.cmp.outputs.build }}
    steps:
      - id: cmp
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          app=$(GH_TOKEN="$APP_TOKEN" gh release view -R stephanieloveshotpot/ai-news-desk --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$app" ]; then echo "can't see the app's releases; building anyway"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release view "$app" -R "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^AI-Pulse-Setup-'; then
            echo "installer for $app already published"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "no installer for $app yet"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the app bundle
        id: bundle
        shell: bash
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          out=$(node scripts/fetch-bundle.js "${{ github.event.inputs.app_tag }}")
          echo "$out"
          echo "version=$(echo "$out" | tail -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The installer is our own WPF app (setup/), not NSIS: the uninstaller
      # is built first, then Setup embeds it together with the zipped app.
      - name: Build the installer
        shell: pwsh
        run: |
          $v = "${{ steps.bundle.outputs.version }}"
          dotnet build setup\Uninstall\Uninstall.csproj -c Release -p:Version=$v -o build\uninstall
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::uninstaller build failed"; exit 1 }
          dotnet build setup\Setup\Setup.csproj -c Release -p:Version=$v "-p:PayloadDir=$PWD\payload\app" "-p:UninstallerExe=$PWD\build\uninstall\Uninstall AI Pulse.exe" -o build\setup
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::setup build failed"; exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\setup\AI-Pulse-Setup.exe "dist\AI-Pulse-Setup-$v.exe"
          Get-ChildItem dist | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Silent-install smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\AI-Pulse-Setup-*.exe | Select-Object -First 1
          $p = Start-Process -Wait -PassThru -FilePath $exe.FullName -ArgumentList "/S"
          if ($p.ExitCode -ne 0) { throw "silent install exited with $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\AI Pulse\AI Pulse.exe"
          if (-not (Test-Path $app)) { throw "app not installed at $app" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\AI Pulse\Uninstall AI Pulse.exe")) { throw "uninstaller missing" }
          if (-not (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AIPulse" -ErrorAction SilentlyContinue)) { throw "Installed apps entry missing" }
          if (Get-Process "AI Pulse" -ErrorAction SilentlyContinue) { throw "a silent install must not start the app" }
          & "$env:LOCALAPPDATA\Programs\AI Pulse\resources\scraper\aipulse-scraper.exe" --list-sources
          if (-not (Test-Path "$([Environment]::GetFolderPath('Programs'))\AI Pulse\AI Pulse.lnk")) { throw "Start menu shortcut missing" }
          $p = Start-Process -Wait -PassThru -FilePath "$env:LOCALAPPDATA\Programs\AI Pulse\Uninstall AI Pulse.exe" -ArgumentList "/S"
          if ($p.ExitCode -ne 0) { throw "silent uninstall exited with $($p.ExitCode)" }
          if (Test-Path $app) { throw "uninstall left the app behind" }
          if (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AIPulse" -ErrorAction SilentlyContinue) { throw "Installed apps entry left behind" }
          Start-Sleep 4
          if (Test-Path "$env:LOCALAPPDATA\Programs\AI Pulse") { throw "install folder left behind" }
          "silent install + uninstall OK"

      - name: Write the checksum the in-app updater verifies
        shell: pwsh
        run: |
          Get-ChildItem dist\AI-Pulse-Setup-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -NoNewline -Encoding ascii "$($_.FullName).sha256" "$h  $($_.Name)"
            "$($_.Name): $h"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/AI-Pulse-Setup-*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bundle.outputs.version }}
          name: AI Pulse ${{ steps.bundle.outputs.version }}
          files: |
            dist/AI-Pulse-Setup-*.exe
            dist/AI-Pulse-Setup-*.exe.sha256
          body: |
            **Download `AI-Pulse-Setup-${{ steps.bundle.outputs.version }}.exe` below and run it.**

            The installer shows the terms of service and privacy policy, lets you choose whether AI Pulse starts with Windows and when it pops up, and creates the app and data folders, Start menu and desktop shortcuts, and an uninstaller. No Python or admin rights needed.

            Windows SmartScreen may warn because the installer isn't code-signed: click *More info → Run anyway*.
